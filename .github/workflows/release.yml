name: Release

# Tag vX.Y.Z → test → build+push the multi-arch image to ghcr.io.
on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match package.json and the quick-start compose image
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "v$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json v$PKG" >&2
            exit 1
          fi
          # The quick-start compose pins the GHCR image; a stale pin ships silent drift.
          if ! grep -q "ghcr.io/end-close/relay:$GITHUB_REF_NAME" docker-compose.yaml; then
            echo "docker-compose.yaml image ref is not ghcr.io/end-close/relay:$GITHUB_REF_NAME — bump it with the version" >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/end-close/relay:${{ github.ref_name }}
            ghcr.io/end-close/relay:latest
