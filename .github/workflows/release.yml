name: Release

# Tag vX.Y.Z → gate (tag matches every manifest) → test → in parallel:
#   - build+push the multi-arch image to ghcr.io
#   - publish @end-close/relay, @end-close/relay-sqlite, @end-close/relay-store-contract to npm
on:
  push:
    tags: ['v*']

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match the root manifest, every package manifest, and the quick-start compose image
        run: |
          WANT=${GITHUB_REF_NAME#v}
          for f in package.json packages/*/package.json; do
            HAVE=$(node -p "require('./$f').version")
            if [ "$HAVE" != "$WANT" ]; then
              echo "$f is $HAVE, but tag $GITHUB_REF_NAME wants $WANT — run prepare-release, do not tag by hand" >&2
              exit 1
            fi
          done
          # The quick-start compose pins the GHCR image; a stale pin ships silent drift.
          if ! grep -q "ghcr.io/end-close/relay:$GITHUB_REF_NAME" docker-compose.yaml; then
            echo "docker-compose.yaml image ref is not ghcr.io/end-close/relay:$GITHUB_REF_NAME — bump it with the version" >&2
            exit 1
          fi

  test:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: scripts/verify-packs.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/end-close/relay:${{ github.ref_name }}
            ghcr.io/end-close/relay:latest

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance attestations; no NPM_TOKEN
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No `registry-url` here on purpose: it writes an `_authToken=${NODE_AUTH_TOKEN}` line
      # into .npmrc, and an empty token gets in the way of the OIDC exchange.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10. pnpm hands the actual
      # upload to the npm binary on PATH.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # Publishes core first (topological order) and skips versions already in the registry, so
      # re-running this job after a partial failure is safe. --no-git-checks: a tag checkout is a
      # detached HEAD, which pnpm's branch check would otherwise reject. --provenance is only
      # valid on a supported CI runner; a manual bootstrap publish from a laptop must pass
      # --provenance=false instead (the manifests deliberately do not force provenance).
      - run: pnpm publish -r --filter './packages/**' --access public --provenance --no-git-checks
